	<!-- SCRIPT DE INTERAÇÃO DA JANELA FLUTUANTE DE DELIVERY -->
	<script>
		(function() {
			const wrapper = document.getElementById('deliveryWrapper');
			const trigger = document.getElementById('deliveryTrigger');
			const closeBtn = document.getElementById('deliveryCloseBtn');

			if (!wrapper || !trigger) return;

			// Alterna abertura no clique / toque
			trigger.addEventListener('click', function(e) {
				const isOpen = wrapper.classList.contains('is-open');
				if (isOpen) {
					wrapper.classList.remove('is-open');
					trigger.setAttribute('aria-expanded', 'false');
				} else {
					wrapper.classList.add('is-open');
					trigger.setAttribute('aria-expanded', 'true');
				}
			});

			// Acessibilidade por teclado (Enter ou Espaço abre/fecha)
			trigger.addEventListener('keydown', function(e) {
				if (e.key === 'Enter' || e.key === ' ') {
					e.preventDefault();
					trigger.click();
				}
			});

			// Botão de fechar
			if (closeBtn) {
				closeBtn.addEventListener('click', function(e) {
					e.stopPropagation();
					wrapper.classList.remove('is-open');
					trigger.setAttribute('aria-expanded', 'false');
				});
			}

			// Fechar se clicar fora
			document.addEventListener('click', function(e) {
				if (!wrapper.contains(e.target)) {
					wrapper.classList.remove('is-open');
					trigger.setAttribute('aria-expanded', 'false');
				}
			});

			// Fechar com a tecla ESC
			document.addEventListener('keydown', function(e) {
				if (e.key === 'Escape') {
					wrapper.classList.remove('is-open');
					trigger.setAttribute('aria-expanded', 'false');
				}
			});
		})();
	</script>
