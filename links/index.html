<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Achadinhos na Shopee - Andressa Meireles</title>
	<style>
		/* ESTILIZAÇÃO DE FUNDO: GRADIENTE DINÂMICO QUE ACOMPANHA A ROLAGEM ATÉ O FINAL */
		html {
			min-height: 100%;
		}

		body {
			margin: 0;
			padding: 40px 15px 80px 15px;
			min-height: 100vh;
			background-color: #7d3b5a;
			background-image: 
				linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
				linear-gradient(180deg, #23121c 0%, #4a2135 45%, #8c3f63 80%, #b85282 100%);
			background-size: 24px 24px, 24px 24px, 100% 100%;
			background-attachment: scroll, scroll, scroll; 
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			justify-content: center;
			box-sizing: border-box;
		}

		/* CONTAINER CENTRAL DOS BANNERS */
		.page-container {
			width: 100%;
			max-width: 850px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 30px;
		}

		/* CABEÇALHO DO PERFIL (AGORA APENAS A IMAGEM ÚNICA) CENTRALIZADO E CLICÁVEL */
		.profile-header {
			display: flex;
			justify-content: center;
			align-items: center;
			text-decoration: none;
			margin-bottom: 15px;
			transition: transform 0.2s ease, opacity 0.2s ease;
		}

		.profile-header:hover {
			transform: scale(1.02);
			opacity: 0.95;
		}

		/* ESTILIZAÇÃO DA SUA IMAGEM COMPLETA (FOTO + NOME + ARROBA) */
		.profile-banner-img {
			height: 75px; /* Tamanho para computador */
			width: auto;
			max-width: 100%;
			object-fit: contain;
			/* Filtro opcional para dar um leve destaque na imagem PNG */
			filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); 
		}

		/* CARD DO BANNER COM PROPORÇÃO DE 1500x600 */
		.banner-card {
			width: 100%;
			display: block;
			text-decoration: none;
			border-radius: 18px;
			overflow: hidden;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.banner-card:hover {
			transform: translateY(-3px);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
		}

		.banner-card img {
			width: 100%;
			height: auto;
			aspect-ratio: 1500 / 600;
			object-fit: cover;
			display: block;
		}

		/* AJUSTES PARA CELULAR (Telas até 600px) */
		@media (max-width: 600px) {
			.profile-banner-img {
				height: 55px; /* Tamanho proporcional reduzido apenas para o celular */
			}
		}
	</style>
</head>
<body>

	<div class="page-container">

		<!-- IMAGEM DO TOPO CENTRALIZADA COM LINK PARA O INSTAGRAM -->
		<a href="https://instagram.com/andressameirelesconfeitaria" target="_blank" rel="noopener noreferrer" class="profile-header">
			<img src="logo.png" alt="Andressa Meireles Confeitaria" class="profile-banner-img">
		</a>

		<!-- BANNER 1 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="banner-shopee.jpg" alt="Achadinhos na Shopee 1">
		</a>

		<!-- BANNER 2 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="link-whatsapp.jpg" alt="Achadinhos na Shopee 2">
		</a>

		<!-- BANNER 3 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="link-instadelivery.jpg" alt="Achadinhos na Shopee 3">
		</a>

		<!-- BANNER 4 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="banner-shopee.jpg" alt="Achadinhos na Shopee 4">
		</a>

		<!-- BANNER 5 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="banner-shopee.jpg" alt="Achadinhos na Shopee 5">
		</a>

		<!-- BANNER 6 -->
		<a href="https://collshp.com/andressameireles?share_channel_code=1&view=storefront" target="_blank" class="banner-card">
			<img src="banner-shopee.jpg" alt="Achadinhos na Shopee 6">
		</a>

	</div>

</body>
</html>
