<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Achadinhos na Shopee - Andressa Meireles</title>
	<style>
		/* ESTILIZAÇÃO DE FUNDO: GRADIENTE DINÂMICO QUE ACOMPANHA A ROLAGEM ATÉ O FINAL */
		html {
			min-height: 100%;
		}

		body {
			margin: 0;
			padding: 40px 15px 80px 15px;
			min-height: 100vh;
			/* Gradiente do bordô escuro no topo ao rosa no final da página */
			background-color: #7d3b5a;
			background-image: 
				/* Malha quadriculada (Grid) */
				linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
				/* Gradiente contínuo de ponta a ponta na rolagem */
				linear-gradient(180deg, #23121c 0%, #4a2135 45%, #8c3f63 80%, #b85282 100%);
			background-size: 24px 24px, 24px 24px, 100% 100%;
			/* 'scroll' faz o gradiente esticar e evoluir junto com a rolagem */
			background-attachment: scroll, scroll, scroll; 
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			justify-content: center;
			box-sizing: border-box;
		}

		/* CONTAINER CENTRAL DOS BANNERS */
		.page-container {
			width: 100%;
			max-width: 850px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
		}

		/* CABEÇALHO DO PERFIL NO TOPO */
		.profile-header {
			display: flex;
			align-items: center;
			gap: 14px;
			margin-bottom: 10px;
		}

		.profile-avatar {
			width: 70px;
			height: 70px;
			border-radius: 50%;
			border: 2px solid #ff9f71;
			object-fit: cover;
		}

		.profile-info {
			display: flex;
			flex-direction: column;
			color: #ffffff;
		}

		.profile-name {
			font-size: 22px;
			font-weight: 700;
			letter-spacing: -0.5px;
			margin: 0;
		}

		.profile-handle {
			font-size: 13px;
			color: #f1cfdd;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-top: 2px;
		}

		/* CARD DO BANNER PADRÃO */
		.banner-card {
			width: 100%;
			display: block;
			text-decoration: none;
			border-radius: 18px;
			overflow: hidden;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.banner-card:hover {
			transform: translateY(-3px);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
		}

		.banner-card img {
			width: 100%;
			height: auto;
			display: block;
		}

		/* BANNER INTERATIVO DO WHATSAPP (SEGUNDA IMAGEM/CARD) */
		.whatsapp-banner {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: linear-gradient(135deg, #075e54 0%, #128c7e 45%, #25d366 100%);
			border-radius: 18px;
			padding: 20px 24px;
			box-sizing: border-box;
			text-decoration: none;
			color: #ffffff;
			box-shadow: 0 8px 24px rgba(37, 211, 102, 0.25);
			border: 1px solid rgba(37, 211, 102, 0.4);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.whatsapp-banner:hover {
			transform: translateY(-3px);
			box-shadow: 0 12px 30px rgba(37, 211, 102, 0.4);
		}

		.whatsapp-content {
			display: flex;
			flex-direction: column;
			gap: 8px;
			max-width: 65%;
		}

		.whatsapp-badge {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			background-color: #25d366;
			color: #ffffff;
			padding: 4px 10px;
			border-radius: 20px;
			font-size: 12px;
			font-weight: 700;
			width: fit-content;
		}

		.whatsapp-title {
			font-size: 18px;
			font-weight: 800;
			line-height: 1.2;
			letter-spacing: 0.3px;
			text-transform: uppercase;
		}

		.whatsapp-subtitle {
			font-size: 13px;
			color: #e2f7eb;
			line-height: 1.3;
		}

		.whatsapp-btn {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: #25d366;
			color: #ffffff;
			font-weight: 700;
			font-size: 13px;
			padding: 10px 16px;
			border-radius: 8px;
			width: fit-content;
			margin-top: 4px;
			box-shadow: 0
