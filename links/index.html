<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andressa Meireles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .banner-link {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .banner-link img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    .banner-link img:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Imagem 1: Link para o Grupo/Achadinhos da Shopee -->
    <a href="SEU_LINK_DA_SHOPEE_AQUI" class="banner-link" target="_blank" rel="noopener noreferrer">
      <img src="banner-shopee.jpg" alt="Achadinhos da Shopee">
    </a>

    <!-- Imagem 2: Link para o WhatsApp de Encomendas -->
    <a href="https://wa.me/55SEUNUMEROAQUI" class="banner-link" target="_blank" rel="noopener noreferrer">
      <img src="banner-whatsapp.jpg" alt="Fazer Pedido no WhatsApp">
    </a>

  </div>

</body>
</html>
